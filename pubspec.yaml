name: removeit_app
description: "Studio-Grade AI Background Removal & Photo Isolation Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Dependency Injection & Functional Errors
  get_it: ^8.0.3
  fpdart: ^1.1.1

  # Local Persistence
  drift: ^2.24.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Media, Camera & Canvas
  image_picker: ^1.1.2
  image: ^4.5.3
  gal: ^2.3.1
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4

  # Monetization & Auth
  google_mobile_ads: ^5.3.1
  purchases_flutter: ^8.7.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Visuals & Typography
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing & Mocking
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

dependency_overrides:
  path_provider_foundation: 2.4.0
